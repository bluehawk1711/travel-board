name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: debug
        type: choice
        options: [debug, release]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate native project (prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Prepare release signing
        if: inputs.build_type == 'release'
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS=android/app/release.keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            for VAR in STORE_PASS ALIAS KEY_PASS; do
              if [ -z "${!VAR}" ]; then
                echo "::error::$VAR is empty - set the ANDROID_* secrets in the repo"
                exit 1
              fi
            done
            if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::Keystore credentials check failed - password or alias does not match"
              exit 1
            fi
            echo "Signing credentials verified (alias: $ALIAS)"
            {
              echo "ANDROID_SIGNING_KS=${GITHUB_WORKSPACE}/mobile/android/app/release.keystore"
              echo "ANDROID_SIGNING_STORE_PASS=$STORE_PASS"
              echo "ANDROID_SIGNING_KEY_ALIAS=$ALIAS"
              echo "ANDROID_SIGNING_KEY_PASS=$KEY_PASS"
              echo "SIGNED_WITH=release keystore ($ALIAS)"
            } >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set - signing the release APK with the debug keystore (personal testing build)"
            if [ ! -f android/app/debug.keystore ]; then
              echo "::error::android/app/debug.keystore missing - expo prebuild must run before this step"
              exit 1
            fi
            {
              echo "ANDROID_SIGNING_KS=${GITHUB_WORKSPACE}/mobile/android/app/debug.keystore"
              echo "ANDROID_SIGNING_STORE_PASS=android"
              echo "ANDROID_SIGNING_KEY_ALIAS=androiddebugkey"
              echo "ANDROID_SIGNING_KEY_PASS=android"
              echo "SIGNED_WITH=debug keystore (personal testing)"
            } >> "$GITHUB_ENV"
          fi
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(findProperty('ANDROID_KEYSTORE_FILE') ?: 'release.keystore')
                      storePassword findProperty('ANDROID_KEYSTORE_PASSWORD') ?: ''
                      keyAlias findProperty('ANDROID_KEY_ALIAS') ?: ''
                      keyPassword findProperty('ANDROID_KEY_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "Signing config injected into app/build.gradle"

      - name: Build Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
              -PANDROID_KEYSTORE_FILE="$ANDROID_SIGNING_KS" \
              -PANDROID_KEYSTORE_PASSWORD="$ANDROID_SIGNING_STORE_PASS" \
              -PANDROID_KEY_ALIAS="$ANDROID_SIGNING_KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$ANDROID_SIGNING_KEY_PASS" \
              --no-daemon --parallel --build-cache
          else
            ./gradlew assembleDebug \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
              --no-daemon --parallel --build-cache
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-board-android-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Android build"
            echo ""
            echo "- Build type: \`${{ inputs.build_type }}\`"
            echo "- Signed: ${SIGNED_WITH:-no (debug signing)}"
            echo "- Package: app.travelboard.mobile"
          } >> "$GITHUB_STEP_SUMMARY"