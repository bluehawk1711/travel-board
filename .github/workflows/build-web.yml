name: Build Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-web:
    name: Build Next.js web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            web-node-modules-${{ runner.os }}-

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-board-web
          path: web/.next
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Web build"
            echo ""
            echo "- \`.next\` output uploaded as \`travel-board-web\`"
          } >> "$GITHUB_STEP_SUMMARY"