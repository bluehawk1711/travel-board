<div class="w-64 h-64 rounded-full bg-secondary-container/15 blur-2xl -translate-y-12"></div>
</div>
<div class="w-full flex justify-end items-center z-10">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container/70 backdrop-blur-md shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary animate-ping"></span>
<span class="w-2 h-2 rounded-full bg-tertiary absolute"></span>

</div>
</div>
<div class="space-y-3">
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tight text-on-surface">
        Travel <span class="text-primary">Board</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto leading-relaxed">
        Plan together. Travel together. <br/>
<span class="font-title-md text-title-md text-secondary">Remember forever.</span>
</p>
</div>
<div class="mt-10 w-44 flex flex-col items-center gap-2.5">
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="h-full bg-gradient-to-r from-secondary-container via-primary to-primary rounded-full w-1/3 animate-[shimmer_1.8s_infinite]" id="splash-progress"></div>
</div>
<span class="font-label-sm text-label-sm text-outline tracking-wider uppercase" id="splash-status">Opening sanctuary...</span>
</div>
</div>
<div class="flex flex-col items-center gap-3 z-10 pb-2 text-center">
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low/80 backdrop-blur-sm shadow-sm">
<span class="material-symbols-outlined text-tertiary" style="font-size: 16px; font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Protected by Google Play Protect</span>
</div>
<div class="flex items-center gap-2 text-outline">
<span class="font-label-sm text-label-sm uppercase tracking-widest font-semibold">Travel Board</span>

<span class="font-label-sm text-label-sm">v2.4 Android Preview</span>
</div>
</div>
</div>
<script>
  (function() {
    const statusMessages = [
      "Gathering wanderlust...",
      "Syncing shared pins...",
      "Calibrating coordinates...",
      "Opening sanctuary..."
    ];
    let msgIdx = 0;
    const statusElem = document.getElementById("splash-status");
    const progressElem = document.getElementById("splash-progress");

    if (statusElem && progressElem) {
      setInterval(() => {
        msgIdx = (msgIdx + 1) % statusMessages.length;
        statusElem.textContent = statusMessages[msgIdx];
      }, 1600);

      let p = 30;
      setInterval(() => {
        p = (p >= 95) ? 30 : p + 18;
        progressElem.style.width = p + "%";
        progressElem.style.transition = "width 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
      }, 1200);
    }
  })();
